name: 대시보드 자동 갱신

on:
  schedule:
    # 매일 08:00 KST (= 23:00 UTC 전날). GitHub Actions 의 cron 은 UTC 기준이다.
    - cron: "0 23 * * *"
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write # 갱신된 dashboard.html 을 저장소에 커밋하기 위해 필요
  pages: write # Pages 재빌드를 직접 요청하기 위해 필요

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 외부 의존성이 없어 npm install 이 필요하지 않다 (Node 내장 fetch 만 사용)
      - name: 슬랙 수집·집계·대시보드 생성
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          CHANNEL_ID: ${{ vars.CHANNEL_ID || 'C02CT82KYP8' }}
          DAYS: ${{ vars.DAYS || '90' }}
        run: node scripts/build.js

      - name: 변경사항 커밋
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dashboard.html snapshot.json
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "대시보드 자동 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Actions 의 기본 토큰으로 push 하면 Pages 재빌드가 자동으로 걸리지 않을 수 있어 직접 요청한다.
      # (Pages Source 가 "Deploy from a branch" 인 경우에 필요하다.)
      - name: Pages 재빌드 요청
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/pages/builds" \
            && echo "Pages 재빌드 요청됨" \
            || echo "재빌드 요청 실패(무시). push 로 자동 재빌드되는지 확인 필요"
